[package]
name = "zclients-rs"
description = "ZClients — one Mac app for many signed-in Zoho profiles"
version = "2.4.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
build = "build.rs"

# The one place the app's version lives. CFBundleShortVersionString is the
# package version above; CFBundleVersion is this build number. build.sh and
# the About/Settings text read both from here.
[package.metadata.zclients]
build = 24

[dependencies]
aes-gcm = "0.11.1"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-web-kit = "0.3.2"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Small, fast binary: whole-program optimisation, no debug symbols, and no
# unwinding machinery (a panic inside an AppKit callback aborts anyway).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
